<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - Fast & Simple</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🔗 CloudCut </h1>
                <p class="subtitle">Transform long URLs into short, shareable links</p>
            </div>

            <form id="shortenForm" class="form">
                <div class="input-group">
                    <label for="longUrl">Enter your long URL</label>
                    <input 
                        type="url" 
                        id="longUrl" 
                        placeholder="https://example.com/very/long/url" 
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="customAlias">Custom alias (optional)</label>
                    <input 
                        type="text" 
                        id="customAlias" 
                        placeholder="my-custom-link"
                        pattern="[a-zA-Z0-9-_]{4,32}"
                        title="4-32 characters: letters, numbers, hyphens, and underscores only"
                        minlength="4"
                        maxlength="32"
                    >
                </div>

                <div class="input-group">
                    <label for="expirationDate">Expiration date (optional)</label>
                    <input 
                        type="datetime-local" 
                        id="expirationDate"
                    >
                    <span class="help-text">Default: 30 days from now if not specified</span>
                </div>

                <button type="submit" class="btn-primary" id="shortenBtn">
                    <span class="btn-text">Shorten URL</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>

            <div id="result" class="result" style="display: none;">
                <div class="result-content">
                    <label>Your shortened URL:</label>
                    <div class="url-display">
                        <input type="text" id="shortUrl" readonly>
                        <button class="btn-copy" id="copyBtn" title="Copy to clipboard">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="expirationInfo" class="expiration-info"></div>
                </div>
            </div>

            <div id="message" class="message" style="display: none;"></div>
        </div>

        <footer class="footer">
            <p>Fast, secure, and reliable URL shortening service</p>
        </footer>
    </div>

    <script>
        // Environment configuration - replace this in production
        window.ENV = {
            API_BASE_URL: 'https://your-api-id.execute-api.amazonaws.com'
        };
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
